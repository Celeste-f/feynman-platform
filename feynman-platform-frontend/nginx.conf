# 第十六次课：前端容器的 Nginx 配置
# 两大职责：①托管 SPA 静态文件 ②把 /api 请求反向代理给后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：/dashboard、/graph 等前端路由刷新时不能 404，都要交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA 的 sw.js 不能被缓存回退，必须每次拿最新（否则版本更新失效）
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 反向代理：浏览器请求 /api/xxx -> 容器网络里的后端 api:3000/api/xxx
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 语音上传等 FormData 请求
        client_max_body_size 20m;
    }
}
